[theme]
primaryColor = "#006B4F"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#F0F6F3"
textColor = "#16352D"
font = "sans serif"

[server]
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
# Oculta la navegación automática que Streamlit crea antes de ejecutar app.py.
# Los enlaces se agregan manualmente después de validar la contraseña.
showSidebarNavigation = false